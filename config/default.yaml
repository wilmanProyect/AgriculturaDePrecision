# Configuración por defecto del sistema de Agricultura de Precisión.

ai:
  model:
    architecture: yolo11m.pt          # Checkpoint base: yolo11n/s/m/l/x.pt
    weights_path: data/models/weeding_detection/weights/best.pt
    device: cuda                      # 'cuda' si hay GPU NVIDIA disponible, si no 'cpu'
    imgsz: 640
    conf_threshold: 0.25
    iou_threshold: 0.45

  classes:
    0: Plant

  row_lines:
    # Vacío a propósito: row_lines_pose-2 (YOLO11m-pose, dataset "Crop-row") no generaliza
    # sobre ortomosaico real (ver docs/BITACORA.md) y no conviene precargarlo como default.
    # Completar cuando haya un modelo YOLO-seg entrenado con imágenes aéreas propias.
    weights_path: ""
    conf_threshold: 0.25
    imgsz: 640

  training:
    dataset_dir: data/images
    data_yaml: data/images/data.yaml
    epochs: 100
    batch: -1                         # -1 = AutoBatch de Ultralytics (recomendado en GPUs de poca VRAM, ej. 4GB)
    patience: 50
    project: data/models
    name: plant_detector

  inference:
    tile_size: 1024
    overlap: 0.2
